spring:
  application:
    name: theatre
  web:
    locale: ru_RU
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/theatre_lab3}
    username: ${DB_USERNAME:theatre_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
